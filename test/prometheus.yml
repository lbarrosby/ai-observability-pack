# Scrapes the fixtures served by test/fixture_server.py. namespace/pod labels emulate Kubernetes service discovery.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - ../alerts/ai-inference-rules.yaml
scrape_configs:
  - job_name: llamacpp
    metrics_path: /llamacpp/metrics
    static_configs:
      - targets: ['127.0.0.1:18998']
        labels:
          namespace: llm
          pod: llama-cpp-0
  - job_name: tei
    metrics_path: /tei/metrics
    static_configs:
      - targets: ['127.0.0.1:18998']
        labels:
          namespace: embeddings
          pod: tei-embed-0
  - job_name: tei_rerank
